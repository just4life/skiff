name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: skiff-linux-x86_64
            bin: target/release/skiff
          - os: windows-latest
            artifact: skiff-windows-x86_64
            bin: target/release/skiff.exe
          - os: macos-latest
            artifact: skiff-macos-arm64
            bin: target/release/skiff
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Linux deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libgl1-mesa-dev libxcursor-dev libxrandr-dev libxi-dev
      - run: cargo clippy --release -- -D warnings
      - run: cargo test --release
      - run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.bin }}
