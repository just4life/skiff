[package]
name = "skiff"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Fast, modern FTP/FTPS/SFTP client written in pure Rust"

[profile.release]
lto = "thin"
opt-level = 3
strip = true

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
chrono = "0.4.45"
crossbeam-channel = "0.5.17"
dirs = "7"
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "clipboard", "links", "wayland", "x11", "accesskit"] }
egui = { version = "0.37", features = ["monochrome_emoji_fonts"] }
egui_extras = "0.37"
log = "0.4.35"
quick-xml = "0.42"
rfd = "0.17"
russh = { version = "0.65", default-features = false, features = ["ring", "flate2", "rsa"] }
russh-sftp = "3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
suppaftp = { version = "12", features = ["rustls-ring", "deprecated"] }
tokio = { version = "1", features = ["rt-multi-thread", "io-util", "fs", "macros", "time", "sync"] }
webpki-roots = "1.0.11"

[dev-dependencies]
env_logger = "0.11.11"

[build-dependencies]
winresource = "0.1.34"
